<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Ituka. Learn how the world works. Build what comes next. Soon...">
  <title>Ituka | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ituka-pink: #e73a56; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #fff; color: var(--ituka-pink); }
    main {
      min-height: 100vh;
      min-height: 100svh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(70px, 11vh, 120px);
    }
    .logo { width: min(72vw, 590px); height: auto; display: block; }
    .message {
      margin: 0;
      font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
      font-weight: 600;
      font-size: clamp(12px, 2.12vw, 30px);
      line-height: 1.25;
      letter-spacing: .012em;
      text-align: center;
      white-space: nowrap;
    }
    @media (max-width: 700px) {
      main { padding: 25px 3vw; gap: clamp(42px, 8vh, 90px); }
      .logo { width: 82vw; }
      .message { font-size: clamp(17px, 4.2vw, 21px); letter-spacing: 0; white-space: normal; max-width: 360px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="ituka-logo.svg" width="569" height="295" alt="Ituka. Play. Build...">
    <h1 class="message">Learn how the world works. Build what comes next. Soon...</h1>
  </main>
</body>
</html>
